<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>День рождения Лязимай</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --accent-red: #d32f2f;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-secondary: #b3b3b3;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 450px;
            width: 100%;
            padding: 40px 15px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-weight: 600;
            font-size: 1.6rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .intro-text {
            color: var(--accent-red);
            font-weight: 400;
            margin-bottom: 30px;
        }

        /* Таймер */
        .timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 30px;
        }

        .timer-item {
            background: var(--card-bg);
            padding: 10px 2px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .timer-item span {
            display: block;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .timer-label {
            font-size: 0.6rem;
            color: var(--text-secondary);
        }

        .description-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            line-height: 1.5;
            margin-bottom: 25px;
            border: 1px solid #262626;
            font-size: 0.95rem;
        }

        /* Dress Code */
        .dress-code {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px dashed #444;
            border-radius: 15px;
        }

        .color-dots {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid #444;
        }

        .details { margin-bottom: 25px; }
        .detail-item { margin: 12px 0; }
        .detail-item strong {
            display: block;
            color: var(--accent-red);
            font-size: 0.75rem;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        /* Кнопки */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border-radius: 50px;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-rsvp { background-color: var(--accent-red); color: white; }
        .btn-2gis { background-color: transparent; border: 1px solid #444; color: white; }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            border: 1px solid var(--accent-red);
        }

        .choice-group {
            display: flex;
            gap: 8px;
            margin: 10px 0 20px;
        }

        .choice-btn {
            flex: 1;
            padding: 12px 5px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: 0.2s;
        }

        .choice-btn.active {
            border-color: var(--accent-red);
            background: rgba(211, 47, 47, 0.2);
        }

        input {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Лязимай Нуржанова</h1>
    <p class="intro-text">приглашает вас на день рождения</p>

    <div class="timer">
        <div class="timer-item"><span id="days">00</span><div class="timer-label">дней</div></div>
        <div class="timer-item"><span id="hours">00</span><div class="timer-label">час</div></div>
        <div class="timer-item"><span id="mins">00</span><div class="timer-label">мин</div></div>
        <div class="timer-item"><span id="secs">00</span><div class="timer-label">сек</div></div>
    </div>

    <div class="description-card">
        Дорогие друзья! Буду очень рада видеть каждого из вас на моем празднике. Давайте проведем этот вечер вместе!
    </div>

    <div class="dress-code">
        <strong style="font-size: 0.8rem; text-transform: uppercase; color: var(--accent-red);">Dress Code</strong>
        <p style="font-size: 0.85rem; margin: 5px 0;">Черный / Красный / Белый</p>
        <div class="color-dots">
            <div class="dot" style="background: #000;"></div>
            <div class="dot" style="background: #d32f2f;"></div>
            <div class="dot" style="background: #fff;"></div>
        </div>
    </div>

    <div class="details">
        <div class="detail-item"><strong>Когда</strong>1 мая 2026, 19:00</div>
        <div class="detail-item"><strong>Где</strong>SOPRANO, Сарайшык 13</div>
    </div>

    <a href="https://2gis.kz/astana/firm/70000001092558674" target="_blank" class="btn btn-2gis">Найти в 2ГИС</a>
    <button class="btn btn-rsvp" onclick="showModal()">Мой ответ</button>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h3 style="margin: 0 0 15px; color: var(--accent-red); font-size: 1.1rem;">Ваш ответ</h3>
        
        <form action="https://formspree.io/f/xreroqka" method="POST" id="rsvpForm">
            <input type="hidden" name="attendance" id="attendanceInput" value="Буду">
            <input type="hidden" name="guests_count" id="guestsInput" value="0">

            <label style="font-size: 0.8rem; opacity: 0.7;">Сможете прийти?</label>
            <div class="choice-group">
                <button type="button" class="choice-btn active" id="btnYes" onclick="setAttendance('Буду')">Приду</button>
                <button type="button" class="choice-btn" id="btnNo" onclick="setAttendance('Не смогу')">Не смогу</button>
            </div>
            
            <input type="text" name="name" placeholder="Ваше имя" required>
            
            <div id="guests-section">
                <label style="font-size: 0.8rem; opacity: 0.7; display: block; margin-top: 15px;">Количество гостей с вами:</label>
                <div class="choice-group">
                    <button type="button" class="choice-btn active" id="g0" onclick="setGuests(0)">Я один</button>
                    <button type="button" class="choice-btn" id="g1" onclick="setGuests(1)">+1</button>
                    <button type="button" class="choice-btn" id="g2" onclick="setGuests(2)">+2</button>
                </div>
            </div>

            <button type="submit" class="btn btn-rsvp" style="margin-top:10px">Отправить ответ</button>
            <button type="button" class="btn-2gis" style="border:none; color: gray; width:100%; cursor:pointer; background:none" onclick="hideModal()">Отмена</button>
        </form>
    </div>
</div>

<script>
    const eventDate = new Date("May 1, 2026 19:00:00").getTime();
    
    function updateTimer() {
        const now = new Date().getTime();
        const diff = eventDate - now;
        if (diff <= 0) return;
        document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
        document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
        document.getElementById("mins").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
        document.getElementById("secs").innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    function showModal() { document.getElementById("modal").style.display = "flex"; }
    function hideModal() { document.getElementById("modal").style.display = "none"; }

    function setAttendance(status) {
        document.getElementById("attendanceInput").value = status;
        document.getElementById("btnYes").classList.toggle("active", status === 'Буду');
        document.getElementById("btnNo").classList.toggle("active", status === 'Не смогу');
        document.getElementById("guests-section").style.display = (status === 'Буду') ? "block" : "none";
    }

    function setGuests(count) {
        document.getElementById("guestsInput").value = count;
        [0, 1, 2].forEach(i => {
            document.getElementById("g" + i).classList.toggle("active", i === count);
        });
    }
</script>

</body>
</html>
